services:
  dlc-downloader:
    # Build manually first (compose can't reference a Dockerfile outside the
    # compose file's own directory in Container Manager/Portainer stacks):
    #   docker build -f docker/Dockerfile -t 360dlc:latest .
    image: 360dlc:latest
    container_name: dlc-downloader
    environment:
      IA_USERNAME: ${IA_USERNAME}
      IA_PASSWORD: ${IA_PASSWORD}
    volumes:
      - dlc-app:/app
      - /volume1/downloads:/data   # adjust to the desired NAS output path
    restart: unless-stopped

volumes:
  dlc-app:
