services:
  dlc-downloader:
    # Build manually first (compose can't reference a Dockerfile outside the
    # compose file's own directory in Container Manager/Portainer stacks):
    #   docker build -f docker/Dockerfile -t 360dlc:latest .
    image: 360dlc:latest
    container_name: dlc-downloader
    environment:
      IA_USERNAME_FILE: /run/secrets/ia_username
      IA_PASSWORD_FILE: /run/secrets/ia_password
    secrets:
      - ia_username
      - ia_password
    volumes:
      - dlc-app:/app
      - /volume1/downloads:/data   # adjust to the desired NAS output path
    restart: unless-stopped

volumes:
  dlc-app:

# Create these two files on the NAS with the literal username/password as
# their exact raw content (e.g. via SSH: `printf '%s' 'your-password' >
# ia_password.txt`, or File Station) - no quoting or `$`-escaping needed.
# Portainer/Compose environment variables (`environment:`/`env_file:`) run
# every value through `$VAR`-style interpolation before it reaches the
# container, which silently corrupts a literal `$` in a password; a
# file-based secret's content is mounted as-is, with no interpolation.
#
# The actual filesystem paths are deployment-specific, so they're not
# hardcoded here - set IA_USERNAME_FILE_PATH/IA_PASSWORD_FILE_PATH in a
# local .env file (gitignored) next to this compose file, e.g.:
#   IA_USERNAME_FILE_PATH=/volume1/path/to/ia_username.txt
#   IA_PASSWORD_FILE_PATH=/volume1/path/to/ia_password.txt
secrets:
  ia_username:
    file: ${IA_USERNAME_FILE_PATH}
  ia_password:
    file: ${IA_PASSWORD_FILE_PATH}
