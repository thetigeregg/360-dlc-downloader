services:
  dlc-downloader:
    # Build manually first (compose can't reference a Dockerfile outside the
    # compose file's own directory in Container Manager/Portainer stacks):
    #   docker build -f docker/Dockerfile -t 360dlc:latest .
    image: 360dlc:latest
    container_name: dlc-downloader
    environment:
      IA_USERNAME_FILE: /run/secrets/ia_username
      IA_PASSWORD_FILE: /run/secrets/ia_password
    secrets:
      - ia_username
      - ia_password
    volumes:
      - dlc-app:/app
      - /volume1/downloads:/data   # adjust to the desired NAS output path
    restart: unless-stopped

volumes:
  dlc-app:

# Create these two files with the literal username/password as their exact
# raw content (e.g. via SSH: `printf '%s' 'your-password' > ia_password.txt`,
# or File Station) - no quoting or `$`-escaping needed. Portainer/Compose
# environment variables (`environment:`/`env_file:`) run every value through
# `$VAR`-style interpolation before it reaches the container, which silently
# corrupts a literal `$` in a password; a file-based secret's content is
# mounted as-is, with no interpolation.
#
# Set the two `file:` paths below to wherever you actually put those files
# on your system (deployment-specific - edit your local copy, don't commit
# your real paths back to this tracked file).
secrets:
  ia_username:
    file: /path/to/ia_username.txt
  ia_password:
    file: /path/to/ia_password.txt
